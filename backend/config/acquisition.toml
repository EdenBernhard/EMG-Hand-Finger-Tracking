# Konfiguration der Rohdaten-Erfassung (Cometa Wave Plus über das .NET-SDK Waveplus.DaqSys
# und pythonnet). Diese Datei ist versioniert: Jede Aufnahme speichert eine Kopie davon neben der CSV.
# Die Abtastrate ist fest 2000 Hz (SamplingRate.Hz_2000 ist die einzige Rate des SDK) und daher
# keine Option.

[sdk]
# Ordner mit Waveplus.DaqSys.dll, Waveplus.DaqSysInterface.dll und CyUSB.dll (relativ zu backend/).
# Die DLLs sind proprietär und nicht versioniert (siehe README, "SDK einrichten").
dir = "lib/cometa"
# Nach dem Erzeugen von DaqSystem initialisiert das SDK den Receiver im Hintergrund
# (NotConnected -> Initializing -> Idle). So lange wird höchstens auf Idle gewartet.
device_ready_timeout_s = 10

[capture]
# Sensor-IDs wie in der Cometa-Software (1-basiert). Altsystem: 1, 2, 4. Seit 2026-11-22 alle sechs
# EMG-Sensoren wie in EMG and Motion Tools (das Notebook in Datenaufbereitung/ wertet 5, 6, 7 aus).
sensor_ids = [1, 2, 4, 5, 6, 7]
# Takt der DataAvailable-Events; SDK erlaubt 10, 25, 50, 100.
event_period_ms = 10
# Nach dem Start senden die Sensoren erst nach einer Anlaufphase (gemessen 2026-10-29: ca. 5 s);
# bis dahin wird nichts gespeichert. Kommen bis zu diesem Zeitpunkt keine echten Messwerte,
# bricht die Aufnahme mit einer Fehlermeldung ab.
startup_timeout_s = 15
# Messbereich des Beschleunigungssensors in jedem EMG-Sensor (g_2, g_4, g_8, g_16).
# g_2 wie im SDK-Beispiel für EMG-Sensoren; gespeichert als Acc_<n> :X/:Y/:Z in g.
accelerometer_full_scale = "g_2"

[csv]
# Spalten der Rohdaten-CSV wie beim CSV-Export einer C3D-Datei aus EMG and Motion Tools:
# Time, dann je Sensor 1..n_sensors: Emg_<n> (nur Sensoren in emg_sensors), Acc_<n> :X/:Y/:Z.
# Nicht aufgenommene Sensoren stehen mit 0 in der Datei. So passt jede Messung ins Notebook.
emg_sensors = [1, 2, 4, 5, 6, 7]
n_sensors = 16

[impedance]
# Vor jeder Messung aus der Webapp die Elektroden-Impedanz aller Sensoren prüfen (SDK:
# CheckElectrodeImpedance, Schwelle laut Hersteller 100 kOhm, Ergebnis nur bestanden/nicht bestanden).
# Besteht ein Sensor nicht, wartet die Messung, bis in der Webapp "Trotzdem messen" oder "Abbrechen" gewählt wird.
check_before_measurement = true

[output]
# Zielordner (relativ zu backend/), nicht versioniert, siehe .gitignore.
# Messungen aus der Webapp: <subjects_dir>/<Proband-ID>/, derselbe Ordner wie proband.json und Fotos.
subjects_dir = "../data/probanden"
# Freie Aufnahmen ohne Proband (emg_tracking.acquisition.cli).
data_dir = "../data/ohne_proband"
