[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emg-tracking"
version = "0.1.0"
description = "EMG-Erfassung (Cometa Wave Plus) und ML-Pipeline für Hand- und Fingerbewegungen"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.23",
    "pythonnet>=3.0.3,<4",  # lädt das .NET-SDK von Cometa (Waveplus.DaqSys, nur Windows)
]

[project.optional-dependencies]
dev = ["pytest>=8"]
c3d = ["ezc3d>=1.5"]  # Import von C3D-Dateien aus EMG and Motion Tools (emg_tracking.acquisition.c3d_import)
# Analyse-Seite je Messung (emg_tracking.analysis): Notebook ausführen + die Pakete, die es importiert
analyse = ["nbclient>=0.10", "nbconvert>=7", "ipykernel>=6", "pandas>=2", "matplotlib>=3.8", "seaborn>=0.13",
           "scipy>=1.11", "scikit-learn>=1.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
